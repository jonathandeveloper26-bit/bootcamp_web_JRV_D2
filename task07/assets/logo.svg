<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Circuit Book logo</title>
  <defs>
    <linearGradient id="cb-grad" gradientUnits="userSpaceOnUse" x1="14" y1="6" x2="114" y2="122">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="cb-glow" cx="0.5" cy="0.25" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Hexagon badge -->
  <polygon points="64,6 114.2,35 114.2,93 64,122 13.8,93 13.8,35"
           fill="#0f172a" stroke="url(#cb-grad)" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="64" cy="42" r="28" fill="url(#cb-glow)"/>

  <g fill="none" stroke="url(#cb-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Open book -->
    <path d="M64 50 C54 44 41 42 31 46 V86 C41 82 54 84 64 90 Z"/>
    <path d="M64 50 C74 44 87 42 97 46 V86 C87 82 74 84 64 90 Z"/>

    <!-- Circuit traces on the pages -->
    <path d="M58 60 H49 L44 55"/>
    <path d="M58 69 H39"/>
    <path d="M58 78 H49 L45 74"/>
    <path d="M70 60 H79 L84 55"/>
    <path d="M70 69 H89"/>
    <path d="M70 78 H79 L83 74"/>

    <!-- Trace rising from the spine to the spark -->
    <path d="M64 50 V36"/>
  </g>

  <!-- Trace endpoints -->
  <g fill="#0f172a" stroke="url(#cb-grad)" stroke-width="2.5">
    <circle cx="44" cy="55" r="2.6"/>
    <circle cx="39" cy="69" r="2.6"/>
    <circle cx="45" cy="74" r="2.6"/>
    <circle cx="84" cy="55" r="2.6"/>
    <circle cx="89" cy="69" r="2.6"/>
    <circle cx="83" cy="74" r="2.6"/>
  </g>

  <!-- Spark of an idea -->
  <path d="M64 18 Q65.5 26.5 72 28 Q65.5 29.5 64 38 Q62.5 29.5 56 28 Q62.5 26.5 64 18 Z" fill="#e0f2fe"/>
</svg>
